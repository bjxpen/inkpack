[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkpack"
version = "0.1.0"
description = "Local storage library for text novel libraries: canonical bytes, dedupe, zstd dictionaries, custom KV metadata, SQLite single/sharded backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pyright>=1.1.370",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["inkpack"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
exclude = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF", "TRY"]
ignore = ["E501", "TRY003"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally evaluate `.result` for its side effects (assert no raise).
"tests/**" = ["B018"]
